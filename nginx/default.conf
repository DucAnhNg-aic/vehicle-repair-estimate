limit_req_zone $binary_remote_addr zone=create_jobs:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=clients:10m;
# API đối tác: giới hạn theo từng API key (request không có key không bị tính, FastAPI trả 401).
limit_req_zone $http_x_api_key zone=partner:10m rate=60r/m;

upstream vre_api {
    zone vre_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server api:8000 resolve;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 26m;
    client_body_timeout 30s;
    limit_conn clients 10;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    auth_basic "VRE Demo";
    auth_basic_user_file /etc/nginx/auth/.htpasswd;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control "no-store" always;

    location = / { return 302 /demo; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }
    location /health/ { return 404; }

    # API đối tác + Swagger (/partner/docs): xác thực bằng X-API-Key trong FastAPI, không dùng Basic Auth.
    # Request POST giữ tối đa VRE_PARTNER_MAX_WAIT_SECONDS (180s) nên read timeout phải dài hơn.
    location /partner/ {
        auth_basic off;
        limit_req zone=partner burst=20 nodelay;
        limit_req_status 429;
        limit_conn clients 30;
        proxy_read_timeout 210s;
        proxy_pass http://vre_api;
        include /etc/nginx/proxy_params_vre;
    }

    location = /api/v1/repair-estimate/jobs {
        limit_req zone=create_jobs burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://vre_api;
        include /etc/nginx/proxy_params_vre;
    }
    location / {
        proxy_pass http://vre_api;
        include /etc/nginx/proxy_params_vre;
    }
}
